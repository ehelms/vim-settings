---
- hosts: localhost
  become: yes
  tasks:
    - name: Install workstation packages
      ansible.builtin.package:
        name:
          - ansible-core
          - curl
          - gcc
          - git
          - golang
          - libvirt
          - libvirt-daemon-config-network
          - libvirt-devel
          - make
          - nodejs
          - npm
          - pkgconf-pkg-config
          - pipx
          - python3
          - python3-pip
          - ruby
          - rubygems
          - tito
          - koji
          - vagrant
          - vim-enhanced
        state: present

    - name: Install Pi coding agent
      become: false
      ansible.builtin.shell:
        cmd: curl -fsSL https://pi.dev/install.sh | sh
      args:
        creates: "{{ lookup('env', 'HOME') }}/.local/bin/pi"

    - name: Install Broker
      become: false
      ansible.builtin.command:
        cmd: pipx install broker
      args:
        creates: "{{ lookup('env', 'HOME') }}/.local/bin/broker"

    - name: Check installed Vagrant plugins
      become: false
      ansible.builtin.command: vagrant plugin list
      register: vagrant_plugins
      changed_when: false
      failed_when: false

    - name: Install vagrant-libvirt
      become: false
      ansible.builtin.command: vagrant plugin install vagrant-libvirt
      when: "'vagrant-libvirt' not in vagrant_plugins.stdout"
